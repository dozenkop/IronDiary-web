<!DOCTYPE html>
<html>

<head>
  <!-- What the published web app is replaced with once its link has expired;
       see tool/web_expire_workflow.yml. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <title>IronDiary</title>
  <style>
    body {
      margin: 0;
      background: #0A0A0A;
      color: #FFFFFF;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 96px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0 0 12px;
      color: #9C9C9C;
    }

    hr {
      margin: 36px 0;
      border: 0;
      border-top: 1px solid #1F1F1F;
    }
  </style>
</head>

<body>
  <main>
    <h1>Dieser Link ist abgelaufen</h1>
    <p>IronDiary schon auf dem Home-Bildschirm? Dann läuft die App dort weiter, mit allen Daten.</p>
    <p>Sonst: Frag nach einem neuen Link.</p>
    <hr>
    <h1>This link has expired</h1>
    <p>Already have IronDiary on your Home Screen? It keeps working there, with all your data.</p>
    <p>Otherwise, ask for a new link.</p>
  </main>
</body>

</html>
